<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento | VetCare</title>

  <link rel="stylesheet" href="css/padrao.css">
  <link rel="stylesheet" href="css/topo.css">
  <link rel="stylesheet" href="css/rodape.css">
  <link rel="stylesheet" href="css/agendamentos.css">
</head>
<body>
  <header class="topo" data-include="components/header.html"></header>

  <main>

    <!-- Cabeçalho da página -->
    <section class="agendamentos-hero">
      <div class="agendamentos-container">
        <div class="agendamentos-cabecalho">
          <p class="agendamentos-rotulo">Atendimento</p>
          <h1 class="agendamentos-titulo">Agende seu atendimento</h1>
          <p class="agendamentos-subtexto">
            Escolha data e horário. Se você já selecionou um serviço em <a href="servicos.html">Serviços</a>,
            ele já está pré-definido abaixo.
          </p>
        </div>
      </div>
    </section>

    <!-- Formulário de agendamento -->
    <section class="agendamentos-container">
      <form id="formAgendamento" class="agendamento-card" novalidate>

        <div class="agendamento-servico">
          <span class="agendamento-servico-rotulo">Serviço selecionado</span>
          <span id="servicoSelecionado" class="agendamento-servico-nome">—</span>
          <button type="button" id="btnTrocarServico" class="agendamento-link">Outro</button>
        </div>

        <fieldset class="agendamento-fieldset">
          <legend>Dados do tutor</legend>
          <div class="agendamento-grid">

            <div class="campo">
              <label for="nomeTutor">Nome do tutor <span class="req">*</span></label>
              <input type="text" id="nomeTutor" name="nomeTutor"
                     placeholder="Ex.: Maria Oliveira" required>
            </div>

            <div class="campo">
              <label for="nomePet">Nome do pet <span class="req">*</span></label>
              <input type="text" id="nomePet" name="nomePet"
                     placeholder="Ex.: Thor" required>
            </div>

          </div>
        </fieldset>

        <fieldset class="agendamento-fieldset">
          <legend>Quando?</legend>
          <div class="agendamento-grid">

            <div class="campo">
              <label for="dataAgendamento">Data <span class="req">*</span></label>
              <input type="date" id="dataAgendamento" name="dataAgendamento" required>
            </div>

            <div class="campo">
              <label for="horaAgendamento">Horário <span class="req">*</span></label>
              <input type="time" id="horaAgendamento" name="horaAgendamento" required>
              <small>Horário de atendimento: 8h às 18h.</small>
            </div>

          </div>
        </fieldset>

        <fieldset class="agendamento-fieldset">
          <legend>Observações</legend>
          <div class="campo full">
            <label for="observacoes">Algo que devemos saber?</label>
            <textarea id="observacoes" name="observacoes" rows="3"
                      placeholder="Ex.: animal com alergia, sintomas, etc."></textarea>
          </div>
        </fieldset>

        <div class="agendacoes">
          <button type="reset" class="btn btn-limpar">Limpar</button>
          <button type="submit" class="btn btn-primario">Confirmar agendamento</button>
        </div>

        <div id="msgAgendamento"></div>

      </form>
    </section>

    <!-- Lista de agendamentos -->
    <section class="agendamentos-container agendamentos-lista-secao">
      <div class="agendamentos-lista-cabecalho">
        <h2>Meus agendamentos</h2>
        <p id="totalAgendamentos">Carregando...</p>
      </div>
      <div id="agendamentos-lista"></div>
    </section>

  </main>

  <script src="js/include.js" defer></script>
  <script src="js/menu.js" defer></script>
  <script src="js/agendamentos.js" defer></script>
  <footer class="rodape" data-include="components/footer.html"></footer>
</body>
</html>
