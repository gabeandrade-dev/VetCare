<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>VetCare - Clínica Veterinária</title>

<link rel="stylesheet" href="css/padrao.css">
<link rel="stylesheet" href="css/topo.css">

</head>
<body>

  <header class="topo" data-include="components/header.html"></header>

  <main>

  <!-- Hero -->
  <section class="home-hero" aria-labelledby="home-hero-titulo">
    <div class="home-container home-hero__conteudo">
      <div class="home-hero__texto">
        <h1 class="home-hero__titulo" id="home-hero-titulo">

        <div class="home-hero__botoes">
          <a href="servicos.html" class="home-botao home-botao--primario">Conheça nossos serviços</a>

      </div>

    <div class="home-hero__midia">
      <!-- PROVISÓRIO: quando tiver a foto, apague a div abaixo e use no lugar:
           <img class="home-hero__imagem" src="img/nome-da-foto.jpg" alt="Descreva o que aparece na foto"> -->
      <div class="home-hero__placeholder" role="img" aria-label="Espaço reservado para a imagem de destaque">
        <span>Espaço da imagem do Hero</span>
      </div>
    </div>
  </section>

</main>
  <footer class="rodape" data-include="components/footer.html"></footer>
