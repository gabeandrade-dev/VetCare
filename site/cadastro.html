<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link rel="stylesheet" href="css/padrao.css">
    <link rel="stylesheet" href="css/topo.css">
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="stylesheet" href="css/lista.css">
</head>

<body>

    <header class="topo" data-include="components/header.html"></header>

    <main class="container">

        <div class="titulo-form">
            <span class="logo">🐾</span>
            <div>
                <h1>Cadastro de Tutor e Pet</h1>
                <p>Preencha os dados abaixo</p>
            </div>
        </div>

        <form id="formCadastro">

            <!-- Dados do Tutor -->
            <fieldset>
                <legend>Dados do Tutor</legend>
                <div class="grid">

                    <div class="campo full">
                        <label for="nomeTutor">Nome completo <span class="req">*</span></label>
                        <input type="text" id="nomeTutor" name="nomeTutor" placeholder="Ex.: Maria Oliveira Santos" required>
                    </div>

                    <div class="campo">
                        <label for="cpfTutor">CPF <span class="req">*</span></label>
                        <input type="text" id="cpfTutor" name="cpfTutor" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>
                    </div>

                    <div class="campo">
                        <label for="contatoTutor">Telefone <span class="req">*</span></label>
                        <input type="tel" id="contatoTutor" name="contatoTutor" placeholder="(00) 00000-0000" required>
                    </div>

                    <div class="campo full">
                        <label for="enderecoTutor">Endereço</label>
                        <input type="text" id="enderecoTutor" name="enderecoTutor" placeholder="Rua, número, complemento">
                    </div>

                </div>
            </fieldset>

            <!-- Dados do Pet -->
            <fieldset>
                <legend>Dados do Pet</legend>
                <div class="grid">

                    <div class="campo">
                        <label for="tipoAnimal">Qual é o seu Pet? <span class="req">*</span></label>
                        <input type="text" id="tipoAnimal" name="tipoAnimal" placeholder="Ex.: Cachorro, Gato" required>
                    </div>

                    <div class="campo">
                        <label for="nomePet">Nome do Pet <span class="req">*</span></label>
                        <input type="text" id="nomePet" name="nomePet" placeholder="Ex.: Thor" required>
                    </div>

                    <div class="campo">
                        <label for="idadePet">Idade (em anos/meses)</label>
                        <input type="number" id="idadePet" name="idadePet" min="0" step="0.1" placeholder="Ex.: 3.5">
                    </div>

                    <div class="campo">
                        <label for="sexoPet">Sexo</label>
                        <select id="sexoPet" name="sexoPet">
                            <option value="">Selecione...</option>
                            <option value="macho">Macho</option>
                            <option value="femea">Fêmea</option>
                        </select>
                    </div>

                    <div class="campo">
                        <label for="pesoAnimal">Peso (kg)</label>
                        <input type="number" step="0.1" min="0" id="pesoAnimal" name="pesoAnimal" placeholder="Ex.: 12.5">
                    </div>

                    <div class="campo">
                        <label for="tamanhoPet">Porte</label>
                        <select id="tamanhoPet" name="tamanhoPet">
                            <option value="">Selecione...</option>
                            <option value="Pequeno">Pequeno</option>
                            <option value="Médio">Médio</option>
                            <option value="Grande">Grande</option>
                        </select>
                    </div>

                </div>
            </fieldset>

            <!-- Saúde -->
            <fieldset>
                <legend>Saúde</legend>
                <div class="grid">

                    <div class="campo">
                        <label>Possui alguma alergia?</label>
                        <div class="radios">
                            <label><input type="radio" name="temAlergia" value="sim"> Sim</label>
                            <label><input type="radio" name="temAlergia" value="nao"> Não</label>
                        </div>
                    </div>

                    <div class="campo">
                        <label>Possui algum tipo de doença?</label>
                        <div class="radios">
                            <label><input type="radio" name="possuiDoenca" value="sim"> Sim</label>
                            <label><input type="radio" name="possuiDoenca" value="nao"> Não</label>
                        </div>
                    </div>

                    <div class="campo">
                        <label>Já foi castrado?</label>
                        <div class="radios">
                            <label><input type="radio" name="foiCastrado" value="sim"> Sim</label>
                            <label><input type="radio" name="foiCastrado" value="nao"> Não</label>
                        </div>
                    </div>

                </div>
            </fieldset>

            <!-- Vacinas -->
            <fieldset>
                <legend>Vacinas</legend>
                <div class="campo full">
                    <label>Quais vacinas seu Pet já tomou?</label>
                    <div class="checks">
                        <label><input type="checkbox" name="vacinas" value="antirrabica"> Antirrábica</label>
                        <label><input type="checkbox" name="vacinas" value="polivalente"> Polivalente</label>
                        <label><input type="checkbox" name="vacinas" value="gripe-canina"> Gripe canina</label>
                        <label><input type="checkbox" name="vacinas" value="giardia"> Giárdia</label>
                    </div>
                </div>
            </fieldset>

            <div class="acoes">
                <button type="reset" class="btn btn-limpar">Limpar</button>
                <button type="submit" class="btn btn-primario">Cadastrar</button>
            </div>

            <div id="msg"></div>
        </form>
    </main>

            <section class="container" id="listaCadastros">

        <div class="titulo-form">
            <span class="logo">📋</span>
            <div>
                <h1>Cadastros realizados</h1>
                <p id="contador">Carregando...</p>
            </div>
        </div>

        <div class="lista-corpo">
            <div class="barra-busca">
                <input type="text" id="busca" placeholder="Buscar por ID, tutor, CPF ou nome do pet">
                <button type="button" id="btnAtualizar" class="btn btn-limpar">Atualizar</button>
            </div>

            <div id="msgLista"></div>
            <div id="listaCards" class="cards"></div>
        </div>

    </section>

    <script src="js/include.js" defer></script>
    <script src="js/menu.js" defer></script>
</body>

</html>
