<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Cadastro </title>
</head>
<body>
 
    <h1> Cadastro do Pet </h1>
   
    <label for="nomeTutor"> Nome do Tutor: </label> <br> 
    <input type="text" id="nomeTutor" name="nomeTutor" rows="50">
    <br> <br>
    
    <label for="nomePet"> Nome do Pet: </label> <br> 
    <input type="text" id="nomePet" name="nomePet">
    <br> <br> 

    <label for="Idade do Pet"> Idade do Pet:</label><br> 
    <input type="text" id="idadePet" name="idadePet">
    <br> <br>

    <label for="especie"> Espécie: </label> <br> 
    <input type="text" id=" especie" name="especie">
    <br> <br>

    <label for="raca"> Raça: </label>  <br>           
    <input type="text" id="raca" name="raca">
    <br> <br>

    <label for="sexoPet"> Sexo do Pet: </label><br> 
    <select id="sexoPet" name="sexoPet">
        <option value=""> Selecione </option>
        <option value="macho"> Macho </option>
        <option value="femea"> Fêmea </option>
    </select>
    <br> <br> 

    <label for="contatoTutor"> Contato do Tutor: </label> <br> 
    <input type="tel" id="contatoTutor" name="contatoTutor">
    <br> <br> 

    <label for="problemaPet"> Qual o Problema: </label>
    <BR> 
        <textarea id="problemaPet" name="problemaPet"
        rows="5" cols="50"></textarea>

</body>
</html>
